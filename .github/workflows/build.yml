name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Download FFmpeg
        run: |
          $ffmpegUrl = "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip"
          Invoke-WebRequest -Uri $ffmpegUrl -OutFile ffmpeg.zip
          Expand-Archive -Path ffmpeg.zip -DestinationPath ffmpeg_temp
          $ffmpegDir = Get-ChildItem -Path ffmpeg_temp -Directory | Select-Object -First 1
          Copy-Item "$($ffmpegDir.FullName)\bin\ffmpeg.exe" -Destination "."
          Copy-Item "$($ffmpegDir.FullName)\bin\ffprobe.exe" -Destination "."
          Remove-Item -Recurse -Force ffmpeg_temp, ffmpeg.zip
        shell: pwsh

      - name: Build executable with PyInstaller
        run: pyinstaller --onefile --windowed --name StreamAutoCutter --icon icon.ico --version-file file_version_info.txt --add-binary "ffmpeg.exe;." --add-binary "ffprobe.exe;." --add-data "icon.png;." main.py
        shell: cmd

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Stream Auto Cutter ${{ github.ref_name }}
          body: |
            ## Stream Auto Cutter ${{ github.ref_name }}

            ### Что нового в v2.3.0

            #### 🎛 Пресеты / Профили пабликов
            - Сохраняй наборы настроек (интро, ватермарки, кодек, fps, разрешение) под любым именем
            - Переключайся между пресетами одним кликом — все поля обновляются мгновенно
            - Переименование и удаление пресетов
            - Пресеты сохраняются в `settings.json` рядом с `.exe`

            #### 📱 Shorts / Вертикальное видео (9:16)
            - Конвертация горизонтального видео в вертикальный формат для YouTube Shorts, TikTok, Reels
            - Три режима: **размытый фон по бокам** (как у YouTube), **обрезка по центру**, **чёрные полосы**
            - Выбор разрешения: 1080×1920 или 720×1280

            #### 🔊 Звуковой оверлей
            - Наложи любой звук (mp3, wav, aac, ogg, flac) поверх оригинальной дорожки
            - Укажи точное время старта (в секундах), громкость и зацикливание
            - Поддержка нескольких оверлеев одновременно

            ### Установка
            1. Скачай `StreamAutoCutter.exe`
            2. Запускай — FFmpeg внутри, ничего не нужно устанавливать!
            3. При обновлении — просто замени `.exe`, настройки сохранятся

            > Требует Windows 10/11 x64

          files: dist/StreamAutoCutter.exe
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
