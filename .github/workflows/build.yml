name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Download FFmpeg
        run: |
          $ffmpegUrl = "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip"
          Invoke-WebRequest -Uri $ffmpegUrl -OutFile ffmpeg.zip
          Expand-Archive -Path ffmpeg.zip -DestinationPath ffmpeg_temp
          $ffmpegDir = Get-ChildItem -Path ffmpeg_temp -Directory | Select-Object -First 1
          Copy-Item "$($ffmpegDir.FullName)\bin\ffmpeg.exe" -Destination "."
          Copy-Item "$($ffmpegDir.FullName)\bin\ffprobe.exe" -Destination "."
          Remove-Item -Recurse -Force ffmpeg_temp, ffmpeg.zip
        shell: pwsh

      - name: Build executable with PyInstaller
        run: pyinstaller --onefile --windowed --name StreamAutoCutter --icon icon.ico --version-file file_version_info.txt --add-binary "ffmpeg.exe;." --add-binary "ffprobe.exe;." --add-data "icon.png;." main.py
        shell: cmd

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Stream Auto Cutter ${{ github.ref_name }}
          body: |
            ## Stream Auto Cutter ${{ github.ref_name }}

            ### Что нового в v3.0.0

            #### ⚡ Архитектура Zero-Disk Temp (Ускорение рендера)
            - Полностью устранена промежуточная нарезка на SSD: сегменты теперь обрабатываются напрямую через быстрый seek (`-ss`) в памяти
            - 0 байт износа накопителя на временные файлы, никаких задержек дискового ввода-вывода (I/O)
            - Устранены артефакты и застывшие кадры на стыках сегментов

            #### 🚀 Параллельный многопоточный рендеринг (Worker Pool)
            - Одновременная обработка нескольких сегментов (выбор 1, 2, 3, 4 потока в настройках)
            - Полноценная утилизация аппаратных блоков видеокарт и многоядерных процессоров
            - Суммирование скорости рендера и точный расчет оставшегося времени (ETA)

            #### 🎮 Поддержка аппаратных энкодеров Intel QuickSync и AMD
            - Добавлены аппаратные кодеки `h264_qsv` / `hevc_qsv` для встроенной графики Intel и `h264_amf` / `hevc_amf` для AMD Radeon
            - Автоматическое определение поддерживаемых ускорений при запуске программы

            #### 📱 Ускорение создания Shorts в 4 раза (Downsample Blur)
            - Внедрен оптимизированный алгоритм размытия боковых полей для вертикальных видео
            - Рендеринг вертикальных Shorts стал на 75% быстрее

            #### 🎛 Пресеты и профили (из v2.3.0)
            - Сохранение наборов настроек под любым именем и переключение в 1 клик
            - Звуковые оверлеи с регулировкой громкости и таймингом

            ### Установка
            1. Скачай `StreamAutoCutter.exe`
            2. Запускай — FFmpeg внутри, ничего не нужно устанавливать!
            3. При обновлении — просто замени `.exe`, настройки сохранятся

            > Требует Windows 10/11 x64

          files: dist/StreamAutoCutter.exe
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
