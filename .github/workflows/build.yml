name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Download FFmpeg
        run: |
          $ffmpegUrl = "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip"
          Invoke-WebRequest -Uri $ffmpegUrl -OutFile ffmpeg.zip
          Expand-Archive -Path ffmpeg.zip -DestinationPath ffmpeg_temp
          $ffmpegDir = Get-ChildItem -Path ffmpeg_temp -Directory | Select-Object -First 1
          Copy-Item "$($ffmpegDir.FullName)\bin\ffmpeg.exe" -Destination "."
          Copy-Item "$($ffmpegDir.FullName)\bin\ffprobe.exe" -Destination "."
          Remove-Item -Recurse -Force ffmpeg_temp, ffmpeg.zip
        shell: pwsh

      - name: Build executable with PyInstaller
        run: pyinstaller --onefile --windowed --name StreamAutoCutter --icon icon.ico --version-file file_version_info.txt --add-binary "ffmpeg.exe;." --add-binary "ffprobe.exe;." --add-data "icon.png;." main.py
        shell: cmd

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Stream Auto Cutter ${{ github.ref_name }}
          body: |
            ## Stream Auto Cutter ${{ github.ref_name }}

            ### Что нового в v3.1.0

            Большое обновление интерфейса: всё стало понятнее, а частые ошибки ловятся до запуска.

            #### 🧭 Понятнее
            - Человеческие подписи вместо технических («Вверху справа», «1080p», «NVIDIA — H.264»)
            - Подсказки при наведении и короткие пояснения у всех настроек
            - Выключенные функции (интро, логотип, звук, Shorts) отображаются серыми
            - Длинные пути сокращаются, отсутствующие файлы подсвечиваются красным, есть кнопка сброса ✕
            - «Прозрачность» логотипа переименована в «Видимость» (100% — полностью виден)
            - Стандартные кнопки на русском

            #### 📂 Результат
            - Можно выбрать папку для сохранения (или как раньше — подпапка output рядом с видео)
            - Кнопка «Папка с результатом»
            - Итоговое окно: сколько файлов и частей готово, за сколько времени, какие ошибки
            - Цветные статусы в очереди, причина ошибки — при наведении на строку
            - Прогресс по каждому файлу: «часть 2/5 • 43%»

            #### 🛡 Меньше ошибок
            - Недоступные на компьютере кодеки нельзя выбрать; если сохранён неработающий — выбирается рабочий автоматически
            - Проверка настроек перед стартом: не выбран файл интро/логотипа/звука, файл удалён и т.п.
            - Закрытие окна во время работы спрашивает подтверждение и корректно останавливает FFmpeg
            - После «Стоп» повторный «Старт» снова берёт отменённые и упавшие файлы
            - Если папка программы недоступна для записи, настройки и лог сохраняются в домашнюю папку

            #### 📥 Очередь
            - Перетаскивание целых папок, файлы сортируются по номеру
            - Дубликаты не добавляются, удаление клавишей Delete
            - Поддержка .flv, .ts, .avi, .webm

            #### 📤 ВКонтакте
            - Сразу видно, сколько видео и названий найдено; предупреждение, если количество не совпадает
            - ID группы можно вводить как 123, club123 или ссылкой
            - Кнопки «показать токен» и «что такое токен»
            - Загрузку в ВК можно запускать во время нарезки

            #### 🎛 Пресеты
            - Звёздочка * у пресета, если настройки изменены и не сохранены
            - Вопрос перед перезаписью существующего пресета

            ### Установка
            1. Скачай `StreamAutoCutter.exe`
            2. Запускай — FFmpeg внутри, ничего не нужно устанавливать!
            3. При обновлении — просто замени `.exe`, настройки сохранятся

            > Требует Windows 10/11 x64

          files: dist/StreamAutoCutter.exe
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
