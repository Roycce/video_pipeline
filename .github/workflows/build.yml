name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build executable with PyInstaller
        run: |
          pyinstaller --onefile --windowed --name StreamAutoCutter main.py

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Stream Auto Cutter ${{ github.ref_name }}
          body: |
            ## Stream Auto Cutter ${{ github.ref_name }}

            ### Что нового в 1.1.0
            - **ВКонтакте**: после успешной загрузки видео автоматически перемещается в папку `uploaded/`
            - **ВКонтакте**: использованное название удаляется из `titles.txt` — не нужно следить вручную
            - **Логотип**: новая опция «Только на сегмент (без интро/аутро)» — лого не показывается поверх заставок
            - **Логотип**: читаемые названия режимов показа вместо технических кодов
            - **Логотип**: для режима «Первые N сек» и «Последние N сек» отключаются неактивные поля

            ### Установка
            1. Скачай `StreamAutoCutter.exe`
            2. Положи рядом `ffmpeg.exe` и `ffprobe.exe`
            3. Запускай

            > Требует Windows 10/11 x64
          files: dist/StreamAutoCutter.exe
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
